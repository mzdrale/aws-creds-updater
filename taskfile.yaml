version: "3"

env:
  BIN_NAME: aws-creds-updater
  VERSION:
    sh: cat ./VERSION 2>/dev/null || echo "0.0.0"
  REVISION:
    sh: test -z ${REVISION} && (git rev-parse --short HEAD 2>/dev/null || echo "unknown") || echo ${REVISION}
  GOOS: "{{ default OS .GOOS }}"
  GOARCH: "{{ default ARCH .GOARCH }}"
  GOLDFLAGS: -s -w -X main.binName={{ .BIN_NAME }} -X main.version={{ .VERSION }}-{{ .REVISION }}
  GOVERSION: 1.26

tasks:
  default:
    - task: build

  build:
    desc: Build go binary ({{ .GOOS }}/{{ .GOARCH }})
    aliases: [b]
    cmds:
      # - go get -d
      - CGO_ENABLED=0 GOOS={{ .GOOS }} GOARCH={{ .GOARCH }} go build -ldflags="{{ .GOLDFLAGS }}" -o {{ .BIN_NAME }} cmd/aws-creds-updater/main.go

  build:all:
    desc: Build for macOS and Linux (amd64 and arm64)
    cmds:
      - task: build:macos
      - task: build:linux

  build:macos:
    desc: Build for macOS (Intel amd64 and ARM64)
    cmds:
      - task: build:macos:arm64
      - task: build:macos:amd64

  build:macos:arm64:
    desc: Build for macOS ARM64
    cmds:
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="{{ .GOLDFLAGS }}" -o {{ .BIN_NAME }}-{{ .VERSION }}-macos-arm64 cmd/aws-creds-updater/main.go

  build:macos:amd64:
    desc: Build for macOS Intel (amd64)
    cmds:
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="{{ .GOLDFLAGS }}" -o {{ .BIN_NAME }}-{{ .VERSION }}-macos-amd64 cmd/aws-creds-updater/main.go

  build:linux:
    desc: Build for Linux (amd64 and ARM64)
    cmds:
      - task: build:linux:arm64
      - task: build:linux:amd64

  build:linux:arm64:
    desc: Build for Linux ARM64
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="{{ .GOLDFLAGS }}" -o {{ .BIN_NAME }}-{{ .VERSION }}-linux-arm64 cmd/aws-creds-updater/main.go

  build:linux:amd64:
    desc: Build for Linux AMD64
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="{{ .GOLDFLAGS }}" -o {{ .BIN_NAME }}-{{ .VERSION }}-linux-amd64 cmd/aws-creds-updater/main.go

  update:
    desc: Update go packages and dependencies to their latest versions
    aliases: [u]
    cmds:
      - go get -u ./...
      - go mod tidy

  install:
    desc: Install go binary
    aliases: [i]
    cmds:
      - go install -ldflags="{{ .GOLDFLAGS }}" ./cmd/aws-creds-updater
      - mv {{ .BIN_NAME }} ~/go/bin/{{ .BIN_NAME }}

  run:
    desc: Compile and run go code
    aliases: [r]
    silent: true
    cmds:
      - go run -ldflags="{{ .GOLDFLAGS }}" ./cmd/aws-creds-updater

  test:
    desc: Run tests
    aliases: [t]
    cmds:
      - go test ./cmd/...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{ .BIN_NAME }} {{ .BIN_NAME }}-*-macos-arm64 {{ .BIN_NAME }}-*-macos-amd64 {{ .BIN_NAME }}-*-linux-arm64 {{ .BIN_NAME }}-*-linux-amd64
